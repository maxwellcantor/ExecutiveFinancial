<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connections PT — Executive Financials</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#f5f6fa;color:#1a2a3a;font-size:14px}
header{background:#0e425b;color:#fff;padding:14px 28px;display:flex;align-items:center;gap:16px}
header .logo-circle{width:38px;height:38px;background:#f36b25;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
header h1{font-size:18px;font-weight:600;letter-spacing:.5px}
header .subtitle{font-size:12px;opacity:.75;margin-top:2px}
.controls{background:#fff;padding:14px 28px;border-bottom:1px solid #e2e6ea;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.controls label{font-size:12px;font-weight:600;color:#6b7c93;text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
select{padding:7px 12px;border:1px solid #d0d7e0;border-radius:6px;font-family:inherit;font-size:13px;background:#fff;color:#1a2a3a;cursor:pointer;min-width:140px}
select:focus{outline:none;border-color:#24acd2}
.main{padding:20px 28px;max-width:1400px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#6b7c93;margin:24px 0 10px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:6px}
.card{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:3px solid #e2e6ea}
.card.orange{border-top-color:#f36b25}
.card.blue{border-top-color:#24acd2}
.card.dark{border-top-color:#0e425b}
.card.green{border-top-color:#27ae60}
.card.red{border-top-color:#e74c3c}
.card-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#6b7c93;margin-bottom:6px}
.card-value{font-size:22px;font-weight:700;color:#1a2a3a}
.card-sub{font-size:11px;color:#6b7c93;margin-top:4px}
.card-change{font-size:12px;font-weight:600;margin-top:4px}
.card-change.pos{color:#27ae60}
.card-change.neg{color:#e74c3c}
.card-change.neu{color:#6b7c93}
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:6px}
.chart-box{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.chart-box.wide{grid-column:span 2}
.chart-title{font-size:12px;font-weight:700;color:#1a2a3a;margin-bottom:4px}
.chart-totals{font-size:11px;color:#6b7c93;margin-bottom:10px}
.chart-totals span{font-weight:600}
.chart-totals .cur{color:#f36b25}
.chart-totals .cmp{color:#24acd2}
canvas{max-height:200px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:6px}
.cards2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:6px}
.divider{border:none;border-top:1px solid #e2e6ea;margin:20px 0}
#nonclinical{display:none}
</style>
</head>
<body>
<header>
  <div class="logo-circle">CPT</div>
  <div>
    <h1>Executive Financials</h1>
    <div class="subtitle">Connections Physical Therapy</div>
  </div>
</header>
<div class="controls">
  <div><label>Clinic</label>

    <select id="sel-year"></select></div>
  <div><label>Compare Year</label>
    <select id="sel-cmp"></select></div>
</div>
<div class="main" id="main"></div>

let charts={};
function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={};}

function fmt(v,type='$'){
  if(v===null||v===undefined||isNaN(v)) return '—';
  if(type==='$'){
    const neg=v<0; const av=Math.abs(v);
    const s=av>=1000000?'$'+(av/1000000).toFixed(1)+'M':av>=1000?'$'+(av/1000).toFixed(0)+'K':'$'+av.toFixed(0);
    return neg?'-'+s:s;
  }
  if(type==='$full'){
    const neg=v<0; const s='$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
    return neg?'-'+s:s;
  }
  if(type==='n') return v===null?'—':Math.round(v).toLocaleString();
  if(type==='%') return v===null?'—':(v>0?'+':'')+v.toFixed(1)+'%';
  if(type==='$v') return v===null?'—':'$'+v.toFixed(2);
  return v;
}

function pct(cur,cmp){
  if(!cur||!cmp||cmp===0) return null;
  return ((cur-cmp)/Math.abs(cmp))*100;
}

function getClinicData(clinic,year){
  return DATA.filter(r=>r.clinic===clinic && r.year===year);
}

function sumField(rows,field){
  const vals=rows.map(r=>r[field]).filter(v=>v!==null&&v!==undefined);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0);
}

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(m){ return MONTHS[parseInt(m.split('-')[1])-1]||m; }

function makeChart(id,type,labels,datasets,opts={}){
  if(charts[id]) charts[id].destroy();
  const ctx=document.getElementById(id).getContext('2d');
  charts[id]=new Chart(ctx,{
    type,
    data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:datasets.length>1,position:'top',labels:{font:{size:11,family:'Montserrat'},boxWidth:12}},
        tooltip:{callbacks:{label:ctx=>{
          const v=ctx.raw; if(v===null||v===undefined) return '';
          if(opts.fmt==='$') return fmt(v,'$full');
          if(opts.fmt==='n') return fmt(v,'n');
          return v;
        }}},
        datalabels:{display:false}
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:10,family:'Montserrat'}}},
        y:{grid:{color:'#f0f0f0'},ticks:{font:{size:10,family:'Montserrat'},callback:v=>opts.fmt==='$'?fmt(v,'$'):fmt(v,'n')}}
      },
      ...opts.extra
    }
  });
}

      `<div class="card-change neu">No prior data</div>`;
    const sub=cval!==null&&cval!==undefined?`<div class="card-sub">${cyr}: ${fmt(cval,cvtype||vtype)}</div>`:'';
    return `<div class="card ${colorClass}"><div class="card-label">${label}</div><div class="card-value">${fmt(val,vtype)}</div>${sub}${chg}</div>`;
  }

  // Monthly data for charts
  const allMonths=Array.from({length:12},(_,i)=>yr+'-'+(String(i+1).padStart(2,'0')));
  function monthVals(rows,field){
    return allMonths.map(m=>{
      const r=rows.find(x=>x.month===m);
      return r&&r[field]!==null?r[field]:null;
    });
  }
  function monthExpenses(rows){
    return allMonths.map(m=>{
      const r=rows.find(x=>x.month===m);
      if(!r) return null;
      const c=r.cog||0, e=r.monthly_exp||0;
      return (c+e)||null;
    });
  }
  const allMonthsCmp=Array.from({length:12},(_,i)=>cyr+'-'+(String(i+1).padStart(2,'0')));
  function monthValsCmp(rows,field){
    return allMonthsCmp.map(m=>{
      const r=rows.find(x=>x.month===m);
      return r&&r[field]!==null?r[field]:null;
    });
  }
  function monthExpensesCmp(rows){
    return allMonthsCmp.map(m=>{
      const r=rows.find(x=>x.month===m);
      if(!r) return null;
      const c=r.cog||0, e=r.monthly_exp||0;
      return (c+e)||null;
    });
  }

  const mLabels=MONTHS;
  const DS_CUR=(data,color)=>{return{label:String(yr),data,borderColor:color,backgroundColor:color+'22',tension:.3,fill:false,pointRadius:3,pointHoverRadius:5,spanGaps:true}};
  const DS_CMP=(data,color)=>{return{label:String(cyr),data,borderColor:color,backgroundColor:color+'22',tension:.3,fill:false,pointRadius:3,pointHoverRadius:5,borderDash:[4,3],spanGaps:true}};

  function totStr(vals,fmt_='$'){
    const s=vals.filter(v=>v!==null).reduce((a,b)=>a+b,0);
    return s>0?fmt(s,fmt_):'—';
  }

  const isCompany=clinic==='Company';
  document.getElementById('nonclinical').style.display=isCompany?'block':'none';

  document.getElementById('main').innerHTML=`
    <div class="section-title">Clinical Operations — Year to Date (${yr})</div>
    <div class="cards">
      ${card('Visits',cur.visits,'n',cmp.visits,'n','orange')}
      ${card('Evals (Referrals)',cur.referrals,'n',cmp.referrals,'n','blue')}
      ${card('Revenue',cur.revenue,'$',cmp.revenue,'$','dark')}
      ${card('Profit',cur.profit,'$',cmp.profit,'$',cur.profit>=0?'green':'red')}
    </div>
    <div class="cards" style="margin-top:10px">
      ${card('Rev / Visit',cur.rpv,'$v',cmp.rpv,'$v','orange')}
      ${card('Rev / Eval',cur.rpe,'$v',cmp.rpe,'$v','blue')}
      ${card('Profit Margin',cur.margin,'%',cmp.margin,'%',cur.margin>=0?'green':'red')}
      <div class="card"></div>
    </div>
    <div class="cards" style="margin-top:10px">
      ${card('Total Expenses',cur.expenses,'$',cmp.expenses,'$','dark')}
      ${card('Expenses / Visit',cur.epv,'$v',cmp.epv,'$v','orange')}
      ${card('COG / Visit',cur.cogpv,'$v',cmp.cogpv,'$v','blue')}
      ${card('Monthly Exp / Visit',cur.mepv,'$v',cmp.mepv,'$v','dark')}
    </div>
    <hr class="divider">
    <div class="section-title">Monthly Trends — ${yr} vs ${cyr}</div>
    <div class="charts">
      <div class="chart-box"><div class="chart-title">Visits</div>
        <div class="chart-totals"><span class="cur">${yr}: ${totStr(monthVals(curRows,'visits'),'n')}</span> &nbsp; <span class="cmp">${cyr}: ${totStr(monthValsCmp(cmpRows,'visits'),'n')}</span></div>
        <canvas id="ch-visits"></canvas></div>
      <div class="chart-box"><div class="chart-title">Revenue</div>
        <div class="chart-totals"><span class="cur">${yr}: ${totStr(monthVals(curRows,'revenue'))}</span> &nbsp; <span class="cmp">${cyr}: ${totStr(monthValsCmp(cmpRows,'revenue'))}</span></div>
        <canvas id="ch-revenue"></canvas></div>
      <div class="chart-box"><div class="chart-title">Profit</div>
        <div class="chart-totals"><span class="cur">${yr}: ${totStr(monthVals(curRows,'profit'))}</span> &nbsp; <span class="cmp">${cyr}: ${totStr(monthValsCmp(cmpRows,'profit'))}</span></div>
        <canvas id="ch-profit"></canvas></div>
      <div class="chart-box"><div class="chart-title">Referrals (Evals)</div>
        <div class="chart-totals"><span class="cur">${yr}: ${totStr(monthVals(curRows,'referrals'),'n')}</span> &nbsp; <span class="cmp">${cyr}: ${totStr(monthValsCmp(cmpRows,'referrals'),'n')}</span></div>
        <canvas id="ch-refs"></canvas></div>
      <div class="chart-box"><div class="chart-title">Monthly Expenses</div>
        <div class="chart-totals"><span class="cur">${yr}: ${totStr(monthVals(curRows,'monthly_exp'))}</span> &nbsp; <span class="cmp">${cyr}: ${totStr(monthValsCmp(cmpRows,'monthly_exp'))}</span></div>
        <canvas id="ch-mexp"></canvas></div>
      <div class="chart-box"><div class="chart-title">Cost of Goods</div>
        <div class="chart-totals"><span class="cur">${yr}: ${totStr(monthVals(curRows,'cog'))}</span> &nbsp; <span class="cmp">${cyr}: ${totStr(monthValsCmp(cmpRows,'cog'))}</span></div>
        <canvas id="ch-cog"></canvas></div>
    </div>
    <div id="nonclinical">
      <hr class="divider">
      <div class="section-title">Company — All Clinics Comparison (${yr} YTD)</div>
      <div id="clinic-table"></div>
    </div>
  `;

  makeChart('ch-visits','line',mLabels,[DS_CUR(monthVals(curRows,'visits'),'#f36b25'),DS_CMP(monthValsCmp(cmpRows,'visits'),'#24acd2')],{fmt:'n'});
  makeChart('ch-revenue','line',mLabels,[DS_CUR(monthVals(curRows,'revenue'),'#f36b25'),DS_CMP(monthValsCmp(cmpRows,'revenue'),'#24acd2')],{fmt:'$'});
  makeChart('ch-profit','line',mLabels,[DS_CUR(monthVals(curRows,'profit'),'#0e425b'),DS_CMP(monthValsCmp(cmpRows,'profit'),'#24acd2')],{fmt:'$'});
  makeChart('ch-refs','line',mLabels,[DS_CUR(monthVals(curRows,'referrals'),'#f36b25'),DS_CMP(monthValsCmp(cmpRows,'referrals'),'#24acd2')],{fmt:'n'});
  makeChart('ch-mexp','line',mLabels,[DS_CUR(monthVals(curRows,'monthly_exp'),'#e74c3c'),DS_CMP(monthValsCmp(cmpRows,'monthly_exp'),'#aaa')],{fmt:'$'});
  makeChart('ch-cog','line',mLabels,[DS_CUR(monthVals(curRows,'cog'),'#e67e22'),DS_CMP(monthValsCmp(cmpRows,'cog'),'#aaa')],{fmt:'$'});

  if(isCompany){
    const tbl=document.getElementById('clinic-table');
    const clinics=ACTIVE_CLINICS.filter(c=>c!=='Company');
    let html=`<table style="width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)">
      <thead><tr style="background:#0e425b;color:#fff">
        <th style="padding:10px 12px;text-align:left">Clinic</th>
        <th style="padding:10px 12px;text-align:right">Visits</th>
        <th style="padding:10px 12px;text-align:right">Referrals</th>
        <th style="padding:10px 12px;text-align:right">Revenue</th>
        <th style="padding:10px 12px;text-align:right">Profit</th>
        <th style="padding:10px 12px;text-align:right">Margin</th>
        <th style="padding:10px 12px;text-align:right">Rev/Visit</th>
      </tr></thead><tbody>`;
    clinics.forEach((c,i)=>{
      const cr=getClinicData(c,yr);
      const v=sumField(cr,'visits'),ref=sumField(cr,'referrals'),
            rev=sumField(cr,'revenue'),prof=sumField(cr,'profit');
      const mg=rev&&prof!==null?prof/rev*100:null;
      const rpv=rev&&v?rev/v:null;
      const bg=i%2===0?'#fff':'#f8f9fb';
      const pc=prof!==null&&prof<0?'color:#e74c3c':'color:#27ae60';
      html+=`<tr style="background:${bg}">
        <td style="padding:8px 12px;font-weight:600">${c}</td>
        <td style="padding:8px 12px;text-align:right">${fmt(v,'n')}</td>
        <td style="padding:8px 12px;text-align:right">${fmt(ref,'n')}</td>
        <td style="padding:8px 12px;text-align:right">${fmt(rev,'$')}</td>
        <td style="padding:8px 12px;text-align:right;${pc};font-weight:600">${fmt(prof,'$')}</td>
        <td style="padding:8px 12px;text-align:right;${pc}">${mg!==null?mg.toFixed(1)+'%':'—'}</td>
        <td style="padding:8px 12px;text-align:right">${rpv!==null?'$'+rpv.toFixed(2):'—'}</td>
      </tr>`;
    });
    html+='</tbody></table>';
    tbl.innerHTML=html;
  }
}

selClinic.addEventListener('change',render);
selYear.addEventListener('change',render);
selCmp.addEventListener('change',render);
render();
</script>
</body>
</html>
